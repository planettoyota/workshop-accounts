<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Workshop Accounts</title>
<style>
:root{--red:#c8102e;--red2:#a30d25;--ink:#1d2129;--ink2:#4a5160;--mut:#7b8290;--line:#e3e6eb;--bg:#f4f5f7;--card:#fff;--ok:#127a3e;--okb:#e5f4eb;--warn:#9a5b00;--warnb:#fff3dc;--bad:#b42318;--badb:#fde8e6;--info:#1d4ed8;--infob:#e6eefc;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.top{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top .brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.top .brand i{display:inline-block;width:10px;height:22px;background:var(--red);border-radius:2px}
.top .sp{flex:1}
.top .rng{display:flex;gap:6px;align-items:center;font-size:12px}
.top .rng input{background:#2c313b;border:1px solid #3c424e;color:#fff;border-radius:6px;padding:4px 6px;font-size:12px;color-scheme:dark}
.top .who{font-size:12px;background:#2c313b;border-radius:20px;padding:4px 10px}
.top button.ghost{background:transparent;border:1px solid #4b5260;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.demo{background:#fff3dc;color:#7a4a00;text-align:center;font-size:12px;padding:4px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:48px;z-index:19}
nav.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
main{padding:16px;max-width:1280px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 12px}
h4{font-size:13px;margin:16px 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi.red .v{color:var(--bad)} .kpi.green .v{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#c5cad3}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red2)}
.btn.d{color:var(--bad);border-color:#f0c4bf}
.btn.s{padding:4px 10px;font-size:12px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{background:#f8f9fb;font-weight:600;color:var(--ink2);font-size:12px;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbfc}
tr.rev td{color:var(--mut);text-decoration:line-through}
tr.sub td{background:#f8f9fb;font-weight:600}
tfoot td{font-weight:700;background:#f8f9fb}
.b{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.b.ok{background:var(--okb);color:var(--ok)}.b.warn{background:var(--warnb);color:var(--warn)}.b.bad{background:var(--badb);color:var(--bad)}.b.info{background:var(--infob);color:var(--info)}.b.g{background:#eceef1;color:var(--ink2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.filters input[type=search]{min-width:220px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:12px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(15,18,24,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:760px;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox.wide{max-width:1180px}
.bulkt td,.bulkt th{font-size:12px;padding:6px 8px}
.prog{height:6px;background:#eceef1;border-radius:4px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.mbox .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut)}
.fg{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.f label{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid #d5d9e0;border-radius:8px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #f3b6c0;border-color:var(--red)}
.f.wide{grid-column:1/-1}
.req::after{content:" *";color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg label{padding:8px 14px;cursor:pointer;border-right:1px solid var(--line);font-weight:600}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg input:checked+span{color:var(--red)}
.seg label:has(input:checked){background:#fdecef}
.err{background:var(--badb);color:var(--bad);border-radius:8px;padding:8px 12px;margin:10px 0;font-weight:600}
.note{background:var(--infob);color:#1e3a8a;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.dues{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.dues .card{padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.lines .ln{display:grid;grid-template-columns:150px 120px 1fr 1fr 34px;gap:6px;margin-bottom:6px;align-items:center}
.lines .ln select,.lines .ln input{padding:8px;border:1px solid #d5d9e0;border-radius:8px;width:100%;min-width:0}
.tot{display:flex;justify-content:space-between;background:#f8f9fb;border-radius:8px;padding:10px 12px;margin-top:8px;font-weight:600;flex-wrap:wrap;gap:8px}
.tot .over{color:var(--bad)}
.login{max-width:360px;margin:60px auto;text-align:center}
.login .card{padding:28px}
.login input{font-size:28px;letter-spacing:12px;text-align:center;width:100%;padding:10px;border:1px solid #d5d9e0;border-radius:10px;margin:14px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;font-weight:600}
#toast.on{opacity:1}#toast.e{background:var(--bad)}
#busy{position:fixed;top:0;left:0;height:3px;background:var(--red);z-index:70;width:0;transition:width .3s}
#busy.on{width:80%;transition:width 8s}
.den{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.den .f input{text-align:right}
.mut{color:var(--mut)} .sm{font-size:12px} .r{text-align:right} .bold{font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.printhead{display:none}
@media (max-width:720px){
  .split{grid-template-columns:1fr}
  .lines .ln{grid-template-columns:1fr 1fr;}
  .lines .ln .del{grid-column:2;justify-self:end}
  main{padding:12px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .kpi .v{font-size:18px}
  .top .rng{width:100%}
  nav.tabs{position:relative;top:auto}
  .top{position:relative}
}
@media print{
  .top,nav.tabs,.noprint,.filters,.chips,.demo,.btn{display:none!important}
  body,main{background:#fff;padding:0}
  .tw{border:0;overflow:visible} th{position:static}
  .printhead{display:block;margin-bottom:10px}
  td,th{padding:4px 6px;font-size:11px}
}
</style>
</head>
<body>
<div id="busy"></div>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="mbox"><button class="x" onclick="closeModal()" aria-label="Close">×</button><div id="mbody"></div></div></div>
<div id="toast"></div>

<script>
/* ======================================================================
   PLANET TOYOTA · WORKSHOP ACCOUNTS — CORE ENGINE  (v1.0)
   Shared by the Apps Script backend and the browser demo.
   Pure logic only. Storage is reached through a `db` adapter:
     db.rows(table) -> [{...row, _r:rowNumber}]
     db.append(table, obj)   db.update(table, _r, partialObj)   db.withLock(fn)
   ====================================================================== */
var WA = (function () {
  'use strict';

  var SCHEMA = {
    Users:    ['UserID','Name','Role','PIN','Active'],
    Settings: ['Key','Value','Note'],
    Masters:  ['List','Value','Active','Parent'],
    Bills:    ['BillID','BillNo','BillDate','Type','JobCardNo','RegNo','Customer','Mobile','Advisor','BillAmount','Scheme','Insurer','ClaimNo','CustShare','InsShare','CreditAllowed','CreditBy','CreditDue','CreditNote','Remarks','Status','CancelReason','EnteredBy','EnteredAt','UpdatedBy','UpdatedAt','TallyVch','TallyBy'],
    Receipts: ['LineID','RcptNo','RcptDate','BillID','BillNo','BillType','Party','Payer','Mode','Account','Amount','RefNo','AdvanceID','Remarks','Status','EnteredBy','EnteredAt','RevReason','RevBy','RevAt','ReconStatus','ReconDate','ReconBy','TallyVch','TallyBy','BatchID'],
    Advances: ['AdvID','AdvDate','Party','Mobile','RegNo','Purpose','Amount','Mode','Account','RefNo','Remarks','Status','EnteredBy','EnteredAt','RevReason','RevBy','RevAt','ReconStatus','ReconDate','ReconBy','TallyVch','TallyBy'],
    Payments: ['PayID','PayDate','ExpGroup','Category','Payee','Narration','Amount','Mode','Account','RefNo','SupplierBillNo','HasBill','LinkID','ApprovedBy','Remarks','Status','EnteredBy','EnteredAt','RevReason','RevBy','RevAt','ReconStatus','ReconDate','ReconBy','TallyVch','TallyBy'],
    Contra:   ['ContraID','CDate','CType','Amount','Account','RefNo','Remarks','Status','EnteredBy','EnteredAt','RevReason','RevBy','RevAt','ReconStatus','ReconDate','ReconBy','TallyVch','TallyBy'],
    DayClose: ['CloseDate','Opening','CashIn','CashOut','Expected','Counted','Denoms','Diff','Remarks','Status','ClosedBy','ClosedAt','VerifiedBy','VerifiedAt','ReopenedBy','ReopenedAt'],
    Log:      ['TS','User','Role','Action','Ref','ClientRef','Details']
  };

  var TMETA = {
    Bills:    { id:'BillID',   date:'BillDate' },
    Receipts: { id:'LineID',   date:'RcptDate' },
    Advances: { id:'AdvID',    date:'AdvDate'  },
    Payments: { id:'PayID',    date:'PayDate'  },
    Contra:   { id:'ContraID', date:'CDate'    }
  };

  var MONEY = ['CASH','UPI','NEFT','CARD','CHEQUE'];
  var BANK  = ['UPI','NEFT','CARD','CHEQUE'];
  var CONTRA = { CASH_TO_BANK:-1, CASH_TO_HO:-1, BANK_TO_CASH:1, CASH_FROM_HO:1 };
  var CONTRA_LBL = { CASH_TO_BANK:'Cash deposited in bank', CASH_TO_HO:'Cash sent to main showroom/HO', BANK_TO_CASH:'Cash withdrawn from bank', CASH_FROM_HO:'Cash received from main showroom/HO' };
  var REFUND_CAT = 'Advance Refund';

  var ALL  = ['CASHIER','ADVISOR','ACCOUNTS','OWNER'];
  var CASH = ['CASHIER','ACCOUNTS','OWNER'];
  var ACC  = ['ACCOUNTS','OWNER'];
  var OWN  = ['OWNER'];
  var PERM = {
    'bill.create':ALL, 'bill.edit':ACC, 'bill.cancel':ACC, 'bill.credit':CASH,
    'receipt.create':CASH, 'writeoff':ACC,
    'advance.create':CASH, 'payment.create':CASH, 'contra.create':CASH,
    'day.close':CASH, 'day.verify':ACC, 'reverse':ACC, 'recon':ACC, 'tally':ACC,
    'backdate':ACC, 'bigcash':ACC, 'admin':OWN
  };

  var DEFAULTS = {
    settings: [
      ['WORKSHOP_NAME','Planet Toyota · Workshop','Shown on reports'],
      ['OPENING_DATE','','Cash book start date (yyyy-mm-dd). No entries allowed before this.'],
      ['OPENING_CASH','0','Physical cash in hand at the start of OPENING_DATE'],
      ['CASH_EXP_LIMIT','10000','Cash expense above this needs Accounts/Owner (Sec 40A(3))'],
      ['EXP_APPROVAL_LIMIT','2000','Expense above this needs an "Approved by" name'],
      ['CASH_RECEIPT_LIMIT','199999','Max cash against one bill (Sec 269ST: below ₹2,00,000)'],
      ['TDS_MAX_PCT','10','Sanity cap: TDS cannot exceed this % of insurance share']
    ],
    masters: {
      ACCOUNT: ['Workshop Bank A/c (rename)','Workshop UPI QR (rename)','Card POS Machine (rename)'],
      INSURER: ['New India Assurance','United India Insurance','National Insurance','The Oriental Insurance','ICICI Lombard','HDFC ERGO','Bajaj Allianz','Tata AIG','IFFCO Tokio','SBI General','Reliance General','Royal Sundaram','Cholamandalam MS','Future Generali','Universal Sompo','Liberty General','Go Digit','Kotak General','Shriram General','Magma HDI','Acko'],
      EXP_GROUP: [],
      EXP_CAT: [],   /* filled from EXP_HEADS below as [ledger, group] pairs */
      ADV_PURPOSE: ['Repair advance','Bodyshop advance (claim pending)','Parts order advance','Accessories','Extended warranty / AMC','Other'],
      ADVISOR: []
    }
  };
  /* Account group (header) -> expense ledgers. Rename in Settings to match Tally exactly. */
  var EXP_HEADS = {
    'Workshop Direct Expenses': ['Consumables (local purchase)','Outside Job / Sublet Work','Towing Charges','Pick-up & Drop','Freight & Cartage'],
    'Staff Welfare Expenses':   ['Tea & Refreshment','Staff Welfare','Staff Conveyance','Uniform & Safety'],
    'Repairs & Maintenance':    ['Building Repairs','Tools & Equipment Repairs','Computer & Printer Repairs','Electrical Repairs'],
    'Vehicle Running Expenses': ['Fuel – Workshop Vehicles','Vehicle Repairs','Toll & Parking'],
    'Office & Administrative':  ['Printing & Stationery','Telephone & Internet','Courier & Postage','Electricity & Water','Cleaning & Housekeeping','Rent'],
    'Miscellaneous Expenses':   ['Miscellaneous','Puja & Festival']
  };
  Object.keys(EXP_HEADS).forEach(function (g) { DEFAULTS.masters.EXP_GROUP.push(g); EXP_HEADS[g].forEach(function (l) { DEFAULTS.masters.EXP_CAT.push([l, g]); }); });
  var REFUND_GROUP = 'Customer Advances';

  /* ---------------- helpers ---------------- */
  function s(v) { return v === undefined || v === null ? '' : String(v).trim(); }
  function num(v) { var t = s(v).replace(/,/g, ''); if (t === '') return NaN; var n = Number(t); return isFinite(n) ? n : NaN; }
  function n0(v) { var n = num(v); return isNaN(n) ? 0 : n; }
  function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function inr(n) { var x = r2(n), neg = x < 0; x = Math.abs(x); var p = x.toFixed(2).split('.'), i = p[0], last = i.slice(-3), rest = i.slice(0, -3); if (rest) last = ',' + last; rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ','); return (neg ? '-' : '') + rest + last + (p[1] === '00' ? '' : '.' + p[1]); }
  function fail(msg, code) { var e = new Error(msg); e.userError = true; e.code = code || ''; throw e; }
  function ymd(v) { v = s(v).slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : ''; }
  function addDays(d, k) { var t = Date.UTC(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10)) + k*86400000; return new Date(t).toISOString().slice(0,10); }
  function clean(o) { var r = {}; for (var k in o) if (k !== '_r') r[k] = o[k]; return r; }
  function up(v) { return s(v).toUpperCase(); }
  function can(me, p) { return (PERM[p] || []).indexOf(me.role) >= 0; }
  function need(me, p) { if (!can(me, p)) fail('Your role (' + me.role + ') is not allowed to do this.'); }

  function setting(db, k, def) {
    var r = db.rows('Settings').filter(function (x) { return s(x.Key) === k; })[0], v = r ? s(r.Value) : '';
    if (/^\d{4}-\d{2}-\d{2}[ T]00:00(:00)?/.test(v)) v = v.slice(0, 10);   // sheet turned a date into date-time
    return v !== '' ? v : def;
  }
  function settingNum(db, k, def) { var v = num(setting(db, k, '')); return isNaN(v) ? def : v; }
  function masters(db, list) { return db.rows('Masters').filter(function (x) { return s(x.List) === list && up(x.Active) !== 'N'; }).map(function (x) { return s(x.Value); }); }
  function expMap(db) {
    var m = {};
    masters(db, 'EXP_GROUP').forEach(function (g) { m[g] = []; });
    db.rows('Masters').forEach(function (x) { if (s(x.List) === 'EXP_CAT' && up(x.Active) !== 'N' && m[s(x.Parent)]) m[s(x.Parent)].push(s(x.Value)); });
    return m;
  }

  function nextId(db, table, field, prefix, ctx) {
    var t = ctx.today(), pre = prefix + '-' + t.slice(2, 4) + t.slice(5, 7) + '-', max = 0;
    db.rows(table).forEach(function (r) { var v = s(r[field]); if (v.indexOf(pre) === 0) { var n = parseInt(v.slice(pre.length), 10); if (n > max) max = n; } });
    return pre + ('000' + (max + 1)).slice(-4);
  }

  function entryDate(db, ctx, me, d) {
    var t = ctx.today(); d = ymd(d) || t;
    if (d > t) fail('Future dates are not allowed.');
    if (d !== t && !can(me, 'backdate')) fail('Only Accounts can post back-dated entries. Use today\'s date.');
    var od = setting(db, 'OPENING_DATE', '');
    if (od && d < od) fail('Date is before the cash book start date (' + od + ').');
    return d;
  }
  function dayRec(db, d) { return db.rows('DayClose').filter(function (x) { return ymd(x.CloseDate) === d; })[0]; }
  function dayOpen(db, d) {
    var r = dayRec(db, d);
    if (r && (r.Status === 'CLOSED' || r.Status === 'VERIFIED')) fail('Cash book for ' + d + ' is ' + r.Status.toLowerCase() + '. Ask Accounts to reopen that day first.', 'DAY_CLOSED');
  }

  /* ---------------- derived figures ---------------- */
  function billAgg(db) {
    var a = {};
    db.rows('Receipts').forEach(function (l) {
      if (l.Status !== 'ACTIVE') return;
      var x = a[l.BillID] || (a[l.BillID] = { c:0, i:0, tds:0, wo:0, cash:0 }), amt = r2(n0(l.Amount));
      if (l.Payer === 'INSURANCE') x.i += amt; else x.c += amt;
      if (l.Mode === 'TDS') x.tds += amt;
      if (l.Mode === 'WRITEOFF') x.wo += amt;
      if (l.Mode === 'CASH') x.cash += amt;
    });
    return a;
  }
  function enrich(b, a) {
    a = a || { c:0, i:0, tds:0, wo:0, cash:0 };
    var o = clean(b);
    o.BillAmount = r2(n0(b.BillAmount)); o.CustShare = r2(n0(b.CustShare)); o.InsShare = r2(n0(b.InsShare));
    o.CustPaid = r2(a.c); o.InsPaid = r2(a.i); o.TDS = r2(a.tds); o.WriteOff = r2(a.wo); o.CashRecd = r2(a.cash);
    o.CustDue = r2(o.CustShare - a.c); o.InsDue = r2(o.InsShare - a.i); o.TotalDue = r2(o.CustDue + o.InsDue);
    o.PayStatus = b.Status === 'CANCELLED' ? 'CANCELLED' : (o.TotalDue <= 0.009 ? 'PAID' : ((a.c + a.i) > 0 ? 'PARTIAL' : 'UNPAID'));
    return o;
  }
  function findBill(db, id) { var b = db.rows('Bills').filter(function (x) { return x.BillID === s(id); })[0]; if (!b) fail('Bill not found.'); return b; }

  function advAgg(db) {
    var a = {};
    function g(id) { return a[id] || (a[id] = { adj:0, ref:0 }); }
    db.rows('Receipts').forEach(function (l) { if (l.Status === 'ACTIVE' && l.Mode === 'ADV_ADJ' && s(l.AdvanceID)) g(s(l.AdvanceID)).adj += r2(n0(l.Amount)); });
    db.rows('Payments').forEach(function (p) { if (p.Status === 'ACTIVE' && s(p.LinkID)) g(s(p.LinkID)).ref += r2(n0(p.Amount)); });
    return a;
  }
  function enrichAdv(v, a) {
    a = a || { adj:0, ref:0 };
    var o = clean(v); o.Amount = r2(n0(v.Amount));
    o.Adjusted = r2(a.adj); o.Refunded = r2(a.ref); o.Balance = r2(o.Amount - a.adj - a.ref);
    o.AdvStatus = v.Status !== 'ACTIVE' ? 'REVERSED' : (o.Balance <= 0.009 ? 'CLOSED' : ((a.adj + a.ref) > 0 ? 'PART' : 'OPEN'));
    return o;
  }
  function advBalance(db, id) {
    var v = db.rows('Advances').filter(function (x) { return s(x.AdvID) === s(id); })[0];
    if (!v || v.Status !== 'ACTIVE') fail('Advance ' + id + ' not found or reversed.');
    return enrichAdv(v, advAgg(db)[s(id)]);
  }

  function cashMoves(db) {
    var m = [];

  const badge = r => r.status === 'SAVED' ? `<span class="b ok">SAVED</span> <span class="sm">${esc(r.ref)}</span>` : r.status === 'READY' ? '<span class="b info">READY</span>' : `<span class="b bad">ERROR</span> <span class="sm" style="color:var(--bad)">${esc(r.errs.join('; '))}</span>`;
  $('#bulkRes').innerHTML = `<div class="row" style="margin:12px 0 8px;gap:14px"><b>${rows.length} rows</b>${saved.length ? `<span class="b ok">${saved.length} saved</span>` : ''}<span class="b info">${ready.length} ready</span><span class="b ${err.length ? 'bad' : 'g'}">${err.length} with errors</span>
    <span class="sm mut">Bill total ${inr(sum(rows, r => r.payload ? r.payload.BillAmount : 0))}</span></div>
  <div class="tw" style="max-height:46vh"><table class="bulkt"><thead><tr><th>Row</th><th>Bill no</th><th>Date</th><th>Type</th><th>Customer</th><th>Paid by</th><th class="n">Amount</th><th>Payments</th><th>Result</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${r.i}</td><td class="bold">${esc(r.src.BillNo)}</td><td>${r.payload && r.payload.BillDate ? fd(r.payload.BillDate) : esc(r.src.BillDate)}</td><td>${esc(r.payload ? r.payload.Type : r.src.Type)}</td><td>${esc(r.src.Customer)}</td><td class="sm">${esc(r.payload ? r.payload.Scheme : '')}${r.src.Insurer ? ' · ' + esc(r.src.Insurer) : ''}</td><td class="n">${r.payload ? amt(r.payload.BillAmount) : ''}</td><td class="sm">${esc(r.pay || '')}</td><td style="white-space:normal;min-width:240px">${badge(r)}</td></tr>`).join('')}
  </tbody></table></div>`;
  $('#bulkFoot').innerHTML = `<button class="btn" onclick="closeModal()">${saved.length ? 'Done' : 'Close'}</button>${err.length ? '<button class="btn" onclick="bulkErrCSV()">⬇ Rows with errors (to fix in Excel)</button>' : ''}<button class="btn" onclick="bulkCheck()">Check again</button>${ready.length ? `<button class="btn p" onclick="bulkImport()">Import ${ready.length} ready row${ready.length > 1 ? 's' : ''}</button>` : ''}`;
}
async function bulkImport() {
  const ready = M.bulk.filter(r => r.status === 'READY'); if (!ready.length || M.busy) return;
  if (!confirm('Save ' + ready.length + ' bills with their payments now?')) return;
  M.busy = true; busy(true);
  try {
    const res = await bulkSend('bulk.bills', ready, 'Saving');
    ready.forEach(r => { const x = res[r.i]; if (x && x.ok) { r.status = 'SAVED'; r.ref = x.ref; } else { r.status = 'ERR'; r.errs = [x ? x.error : 'Not saved — check again']; } });
    const n = ready.filter(r => r.status === 'SAVED').length;
    toast(n + ' bills saved');
    S.d = await api('load', { from: S.from, to: S.to }); render(); $('#modal').classList.remove('hidden');
  } catch (e) { showErr(e.message + ' — press Import again; rows already saved will not be duplicated.'); }
  finally { M.busy = false; busy(false); bulkShow(); }
}
function bulkErrCSV() {
  const err = M.bulk.filter(r => r.status === 'ERR');
  const csv = [BULK_COLS.map(c => c[1]).concat(['Error'])].concat(err.map(r => BULK_COLS.map(c => r.src[c[0]]).concat([r.errs.join('; ')]))).map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'bulk_rows_with_errors.csv'; document.body.appendChild(a); a.click(); a.remove();
}

function rTot() {
  if (M.inBill) {
    M.due = billCustShare();

    $('#payins').classList.toggle('hidden', !(M.due <= 0 && formVals('#mbody').Scheme === 'INSURANCE'));

/* =================== CASH BOOK =================== */
function vCash() {
  const d = D(), cb = d.cashbook; let bal = cb.opening, h = '';
  const byDay = {}; cb.moves.forEach(m => (byDay[m.date] = byDay[m.date] || []).push(m));
  const dcs = {}; (d.dayclose || []).forEach(x => dcs[x.CloseDate] = x);
  const allDays = Object.keys(Object.assign({}, byDay, dcs)).filter(x => x >= d.from && x <= d.to).sort();
  const tin = sum(cb.moves.filter(m => m.amt > 0), m => m.amt), tout = -sum(cb.moves.filter(m => m.amt < 0), m => m.amt);
  h += `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Cash book</h2><div class="row noprint">${isCash() ? `<button class="btn" onclick="contraForm()">Cash deposit / transfer</button><button class="btn p" onclick="dayForm('${d.today}')">Close day</button>` : ''}<button class="btn" onclick="window.print()">Print</button></div></div>
  <div class="printhead"><b>${esc(d.settings.WORKSHOP_NAME)} — Cash Book</b> · ${fd(d.from)} to ${fd(d.to)}</div>
  <div class="grid" style="margin-bottom:14px"><div class="card kpi"><div class="l">Opening ${fd(d.from)}</div><div class="v">${inr(cb.opening)}</div></div><div class="card kpi green"><div class="l">Cash in</div><div class="v">${inr(tin)}</div></div><div class="card kpi red"><div class="l">Cash out</div><div class="v">${inr(tout)}</div></div><div class="card kpi"><div class="l">Closing ${fd(d.to)}</div><div class="v">${inr(cb.opening + tin - tout)}</div></div></div>
  <div class="tw"><table><thead><tr><th>Date</th><th>Voucher</th><th>Type</th><th>Particulars</th><th class="n">Receipt</th><th class="n">Payment</th><th class="n">Balance</th></tr></thead><tbody>
  <tr class="sub"><td>${fd(d.from)}</td><td colspan="5">Opening balance</td><td class="n">${amt(bal)}</td></tr>`;
  allDays.forEach(day => {
    const mv = byDay[day] || [];
    mv.forEach(m => { bal = r2(bal + m.amt); h += `<tr><td>${fd(m.date)}</td><td>${esc(m.id)}</td><td class="sm">${esc(m.kind)}</td><td>${esc(m.narr)}</td><td class="n">${m.amt > 0 ? amt(m.amt) : ''}</td><td class="n">${m.amt < 0 ? amt(-m.amt) : ''}</td><td class="n">${amt(bal)}</td></tr>`; });
    const dc = dcs[day];
    h += `<tr class="sub"><td>${fd(day)}</td><td colspan="3">Day closing ${dc ? `<span class="b ${dc.Status === 'VERIFIED' ? 'ok' : dc.Status === 'CLOSED' ? 'info' : 'warn'}">${dc.Status}</span> counted ${inr(dc.Counted)}${Math.abs(N(dc.Diff)) > 0.009 ? ` <span class="b bad">DIFF ${amt(dc.Diff)}</span>` : ''}${dc.Status !== 'REOPENED' && Math.abs(N(dc.Expected) - bal) > 0.009 ? ' <span class="b bad">CHANGED AFTER CLOSE</span>' : ''}` : '<span class="b warn">NOT CLOSED</span>'}</td><td class="n">${amt(sum(mv.filter(m => m.amt > 0), m => m.amt))}</td><td class="n">${amt(-sum(mv.filter(m => m.amt < 0), m => m.amt))}</td><td class="n">${amt(bal)}</td></tr>`;
  });

    S.pin = p; busy(true);
    try { const r = await api('login', {}); S.me = r.me; S.from = DEMO ? WA.addDays(r.today, -4) : r.today.slice(0, 8) + '01'; S.to = r.today; await load(); return; }
    catch (e) { store.set('wa_pin', ''); S.pin = ''; } finally { busy(false); }
  }
  render();
})();
</script>
